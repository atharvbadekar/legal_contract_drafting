services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mira-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mira_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  legal-nlp:
    build:
      context: ./services/legal-nlp
      dockerfile: Dockerfile
    container_name: mira-legal-nlp
    restart: always
    environment:
      - LEGAL_MODEL_NAME=law-ai/InLegalBERT
      - LEGAL_MODEL_DEVICE=cpu
      - LEGAL_MAX_LENGTH=512
    ports:
      - "8001:8001"
    volumes:
      - hf_cache:/root/.cache/huggingface

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mira-backend
    restart: always
    depends_on:
      - postgres
      - legal-nlp
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/mira_db?schema=public
      - JWT_SECRET=mira_research_jwt_secret_key_2026_secure
      - LEGAL_NLP_URL=http://legal-nlp:8001
      - RAG_TOP_K=5
      - GENERATION_MODEL_NAME=open-weight/mira-legal-draft-v1
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mira-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
  hf_cache:
